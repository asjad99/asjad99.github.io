- name: Data Architecture & Engineering
  description: Design and build modern data platforms that scale with your business - from lakehouse foundations to real-time streaming pipelines.
  offerings:
    - Lakehouse design & implementation
    - Data fabric architecture
    - ETL/ELT pipeline engineering
    - Real-time streaming & CDC
    - Data modelling & schema design

- name: AI & Intelligence Engineering
  description: Build the intelligence layer on top of your data - production-grade ML systems, not just notebooks and prototypes.
  offerings:
    - Intelligence engine design
    - ML model development & deployment (MLOps)
    - Decision intelligence systems
    - Computational intelligence & optimisation
    - AI readiness assessment

- name: Data Governance & Strategy
  description: Establish the policies, processes, and tooling that make data trustworthy and compliant across your organisation.
  offerings:
    - Data governance frameworks
    - Catalog & lineage implementation
    - Data quality engineering
    - Regulatory compliance (GDPR, SOX, etc.)
    - Data strategy & roadmap consulting
